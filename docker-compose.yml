services:
  valkey-ci:
    image: valkey/valkey:8.0.1
    ports:
      - "6379:6379"
      - "16379:16379"
    command:
      - valkey-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
  valkey-cluster:
    image: valkey/valkey:8.0.1
    ports:
      - "6379-6381:6379-6381"
    volumes:
      - ./cluster-setup.sh:/usr/local/bin/cluster-setup.sh:ro
      - ./data:/data
    command: ["bash", "/usr/local/bin/cluster-setup.sh"]
    environment:
      - SKIP_SYSCTL=1
    network_mode: "host"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
