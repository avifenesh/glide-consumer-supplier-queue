name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start a Valkey cluster
        run: |
          docker compose up -d --wait --wait-timeout 60 valkey-ci
          docker compose exec -T valkey-ci valkey-cli CLUSTER ADDSLOTSRANGE 0 16383

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: node

      - name: Run Node unit tests
        run: npm test
        working-directory: node

      - name: Run Node example
        run: timeout 120 npm run example
        working-directory: node

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: python

      - name: Run Python unit tests
        run: pytest
        working-directory: python

      - name: Run Python example
        run: timeout 120 python main.py
        working-directory: python

      - name: Stop the test cluster
        if: always()
        run: docker compose down --volumes
